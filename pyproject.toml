[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sheet-audit-trail"
version = "1.0.0"
description = "Audit-grade diffs for Excel workbooks and Google Sheets, posted to GitHub pull requests."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RyMB-007" }]
keywords = ["excel", "xlsx", "spreadsheet", "diff", "audit", "github-action", "financial-model", "google-sheets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Software Development :: Version Control :: Git",
]
# Upper bounds keep a future major release of a dependency from breaking
# every workflow that uses the action overnight.
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
gsheets = ["google-auth>=2.20,<3", "requests>=2.31,<3"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/RyMB-007/sheet-audit-trail"
Marketplace = "https://github.com/marketplace/actions/spreadsheet-audit-trail"
Changelog = "https://github.com/RyMB-007/sheet-audit-trail/blob/main/CHANGELOG.md"
Issues = "https://github.com/RyMB-007/sheet-audit-trail/issues"

[project.scripts]
sheetaudit = "sheetaudit.cli:main"

[tool.setuptools]
packages = ["sheetaudit"]
